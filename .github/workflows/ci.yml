name: RaceDay CI/CD

on:
  push:
    branches: [ main, RaceDay_API_Part_3 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: Validate Repository Structure
  # =========================================================
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo " Missing /docs folder"
            exit 1
          fi
          echo " /docs folder exists"

      - name: Verify README.md exists
        run: |
          if [ ! -f "README.md" ]; then
            echo " Missing README.md"
            exit 1
          fi
          echo " README.md exists"

  # =========================================================
  # JOB 2: Build and Test API
  # =========================================================
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay/RaceDay.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay/RaceDay.slnx --no-build --configuration Release --verbosity normal

  # =========================================================
  # JOB 3: Docker Build (Part 3 requirement)
  # =========================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC Docker Image
        run: docker build -f RaceDay/RaceDay.Mvc/Dockerfile -t raceday-mvc:part3 .
